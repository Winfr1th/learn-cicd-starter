name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{secrets.DATABASE_URL}}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Setting up Goose for migration
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build app
        run: ./scripts/buildprod.sh

      - name:
        run: ./scripts/migrateup.sh

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: submit
        run: "gcloud builds submit --tag asia-southeast2-docker.pkg.dev/notely-485505/notely-ar-repo/notely/v1 ."

      - name: Deploy to cloud run
        run: gcloud run deploy notely --image asia-southeast2-docker.pkg.dev/notely-485505/notely-ar-repo/notely/v1 --region us-central1 --allow-unauthenticated --project notely-485505 --max-instances=4
